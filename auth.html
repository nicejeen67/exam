<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | AI EXAM</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight: 45 920;
  font-display: swap;
}

:root {
  --bg: #0B1220;
  --bg-panel: #121A2C;
  --bg-panel-raised: #17213A;
  --line: #26324C;
  --line-bright: #37456A;
  --gold: #C9A227;
  --gold-soft: rgba(201, 162, 39, 0.14);
  --signal: #38D39F;
  --urgent: #E2572B;
  --text: #EDF1F7;
  --text-muted: #92A0BC;
  --text-faint: #5E6B87;
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 36px 32px;
}

.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand-mark {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.brand-mark span { color: var(--gold); }

.brand-sub {
  margin-top: 4px;
  font-size: 0.78rem;
  color: var(--text-faint);
}

.tab-row {
  display: flex;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.9rem;
  font-weight: 700;
  padding: 10px 0;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: inherit;
}

.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--gold);
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 5px;
  font-weight: 600;
}

.field input, .field select {
  width: 100%;
  background: var(--bg-panel-raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 0.88rem;
  font-family: inherit;
}

.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--gold);
}

.role-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.role-toggle button {
  flex: 1;
  padding: 9px 0;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-panel-raised);
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.role-toggle button.active {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-soft);
}

.submit-btn {
  width: 100%;
  margin-top: 6px;
  padding: 12px 0;
  border-radius: 999px;
  border: none;
  background: var(--gold);
  color: #1A1404;
  font-size: 0.92rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

.msg-box {
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  line-height: 1.5;
  display: none;
}

.msg-box.error {
  display: block;
  background: rgba(226, 87, 43, 0.12);
  border: 1px solid rgba(226, 87, 43, 0.35);
  color: #FCA783;
}

.msg-box.success {
  display: block;
  background: rgba(56, 211, 159, 0.1);
  border: 1px solid rgba(56, 211, 159, 0.35);
  color: #7FE8C4;
}

.hint {
  margin-top: 18px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-faint);
  line-height: 1.6;
}

.panel { display: none; }
.panel.active { display: block; }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

<div class="auth-card">
  <div class="brand">
    <div class="brand-mark">AI<span>EXAM</span></div>
    <div class="brand-sub">서울사이버대학교 AI부동산빅데이터학과</div>
  </div>

  <div class="tab-row">
    <button type="button" class="tab-btn active" data-tab="login">로그인</button>
    <a class="tab-btn" href="signup.html" style="text-align:center;text-decoration:none">회원가입</a>
  </div>

  <!-- LOGIN -->
  <div class="panel active" id="panel-login">
    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">아이디</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn" id="loginSubmitBtn">로그인</button>
      <div class="msg-box" id="loginMsg"></div>
    </form>
    <div class="hint">교수 계정은 관리자 승인 후 로그인할 수 있습니다.</div>
  </div>

  <!-- SIGNUP -->
  <div class="panel" id="panel-signup">
    <form id="signupForm">
      <div class="role-toggle">
        <button type="button" class="active" data-role="student">학생으로 가입</button>
        <button type="button" data-role="professor">교수로 가입</button>
      </div>

      <div class="field">
        <label for="signupName">이름</label>
        <input type="text" id="signupName" required>
      </div>
      <div class="field">
        <label for="signupUsername">아이디</label>
        <input type="text" id="signupUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="signupPassword">비밀번호</label>
        <input type="password" id="signupPassword" autocomplete="new-password" required>
      </div>
      <div class="field" id="subjectField" style="display:none;">
        <label for="signupSubject">담당 과목</label>
        <select id="signupSubject"></select>
      </div>

      <button type="submit" class="submit-btn" id="signupSubmitBtn">가입 신청</button>
      <div class="msg-box" id="signupMsg"></div>
    </form>
    <div class="hint">교수로 가입하시면 관리자 승인 후 담당 과목의 교안·기출문제를 업로드할 수 있습니다.</div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  let selectedRole = 'student';

  // 이미 로그인되어 있으면 바로 이동
  (async function checkExisting() {
    const token = sessionStorage.getItem('aiexam_token');
    if (!token) return;
    try {
      const res = await fetch(`${AIEXAM_API}/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (res.ok) {
        const user = await res.json();
        redirectAfterLogin(user.role);
      } else {
        sessionStorage.removeItem('aiexam_token');
        sessionStorage.removeItem('aiexam_user');
      }
    } catch (e) { /* 네트워크 오류 시 로그인 화면 유지 */ }
  })();

  function redirectAfterLogin(role) {
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect');
    if (redirect) {
      location.href = decodeURIComponent(redirect);
      return;
    }
    // 관리자는 관리자 페이지(교수 승인/삭제 등)로, 그 외에는 포털로 이동
    location.href = role === 'admin' ? 'admin.html' : 'index.html';
  }

  // 탭 전환
  document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
    });
  });

  // 역할 토글
  document.querySelectorAll('.role-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedRole = btn.dataset.role;
      document.getElementById('subjectField').style.display = selectedRole === 'professor' ? 'block' : 'none';
    });
  });

  // 과목 목록 로드
  async function loadSubjects() {
    try {
      const res = await fetch(`${AIEXAM_API}/subjects`);
      const subjects = await res.json();
      const select = document.getElementById('signupSubject');
      select.innerHTML = subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    } catch (e) {
      console.warn('과목 목록을 불러오지 못했습니다.', e);
    }
  }
  loadSubjects();
  (function prefill() {
    const u = new URLSearchParams(location.search).get('u');
    if (u) {
      document.getElementById('loginUsername').value = u;
      showMsg(document.getElementById('loginMsg'), '회원가입이 완료되었습니다. 비밀번호를 입력해 로그인하세요.', 'success');
      document.getElementById('loginPassword').focus();
    }
  })();

  function showMsg(el, text, type) {
    el.className = `msg-box ${type}`;
    el.innerText = text;
  }

  // 로그인 제출
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginSubmitBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true;

    const formData = new FormData();
    formData.append('username', document.getElementById('loginUsername').value.trim());
    formData.append('password', document.getElementById('loginPassword').value);

    try {
      const res = await fetch(`${AIEXAM_API}/login`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        showMsg(msg, data.detail || '로그인에 실패했습니다.', 'error');
        return;
      }
      sessionStorage.setItem('aiexam_token', data.token);
      sessionStorage.setItem('aiexam_user', JSON.stringify(data.user));
      redirectAfterLogin(data.user.role);
    } catch (err) {
      showMsg(msg, '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.', 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // 회원가입 제출
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signupSubmitBtn');
    const msg = document.getElementById('signupMsg');
    btn.disabled = true;

    const formData = new FormData();
    formData.append('username', document.getElementById('signupUsername').value.trim());
    formData.append('password', document.getElementById('signupPassword').value);
    formData.append('name', document.getElementById('signupName').value.trim());
    formData.append('role', selectedRole);
    if (selectedRole === 'professor') {
      formData.append('subject_id', document.getElementById('signupSubject').value);
    }

    try {
      const res = await fetch(`${AIEXAM_API}/register`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        showMsg(msg, data.detail || '가입에 실패했습니다.', 'error');
        return;
      }
      showMsg(msg, data.message, 'success');
      document.getElementById('signupForm').reset();
      if (selectedRole === 'student') {
        setTimeout(() => {
          document.querySelector('.tab-btn[data-tab="login"]').click();
        }, 1200);
      }
    } catch (err) {
      showMsg(msg, '서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.', 'error');
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
